[project]
name = "uc-intg-russound"
version = "0.1.0"
description = "Unfolded Circle Remote integration for Russound MCA-88 and other RIO multi-zone controllers"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"

authors = [
    { name = "ferdaze" }
]

urls.Homepage = "https://github.com/ferdaze/uc-intg-russound"
urls.Repository = "https://github.com/ferdaze/uc-intg-russound"
urls.Issues = "https://github.com/ferdaze/uc-intg-russound/issues"

dependencies = [
    "ucapi==0.7.0",
    "ucapi-framework==1.9.7",
    "pyee>=9.0,<14",
    "aiorussound==5.0.2",
]

[tool.black]
line-length = 90

[tool.isort]
profile = "black"
