# Lints and tests every push and pull request, builds the aarch64 package for the Remote,
# and publishes a GitHub release when a version tag (v*) is pushed.
name: "Build & Release"

"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  INTG_NAME: russound # integration folder: intg-russound
  # Python version of the Remote's PyInstaller builder image.
  # See https://hub.docker.com/r/unfoldedcircle/r2-pyinstaller for possible versions.
  PYTHON_VER: 3.11.13-0.7.0

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r test-requirements.txt

      - name: Pylint
        run: python -m pylint intg-${{ env.INTG_NAME }}

      - name: Flake8
        run: python -m flake8 intg-${{ env.INTG_NAME }} --count --show-source --statistics

      - name: Import order (isort)
        run: python -m isort intg-${{ env.INTG_NAME }}/. tests/. --check --diff

      - name: Formatting (black)
        run: python -m black intg-${{ env.INTG_NAME }} tests --check --diff --line-length 120

      - name: Unit tests
        run: python -m pytest -v

  build:
    name: Build aarch64 package
    needs: test
    # Native ARM runner: the builder image runs without QEMU emulation.
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.get-version-and-id.outputs.VERSION }}
      driver_id: ${{ steps.get-version-and-id.outputs.DRIVER_ID }}
      release_notes: ${{ steps.changelog.outputs.NOTES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version and id
        id: get-version-and-id
        run: |
          DRIVER_ID=$(jq -r .driver_id driver.json)
          DRIVER_VERSION=$(jq -r .version driver.json)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            if [[ "$VERSION" != "$DRIVER_VERSION" ]]; then
              echo "::error::Tag v$VERSION does not match version $DRIVER_VERSION in driver.json"
              exit 1
            fi
          else
            VERSION="${DRIVER_VERSION}-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DRIVER_ID=$DRIVER_ID" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "DRIVER_ID=$DRIVER_ID" >> $GITHUB_OUTPUT

      - name: Extract changelog notes
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          NOTES=$(awk "/^## v${VERSION}/{ found=1; next } found && /^## /{ exit } found{ print }" CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' | sed '/^---$/d')
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          EOF=$(openssl rand -hex 8)
          echo "NOTES<<$EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          echo "Starting pyinstaller build for ${DRIVER_ID} ${VERSION}"
          docker run --rm --name builder \
            --platform=linux/arm64 \
            --user=$(id -u):$(id -g) \
            -v ${GITHUB_WORKSPACE}:/workspace \
            docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER} \
            bash -c \
            "cd /workspace && \
              python -m pip install -r requirements.txt && \
              pyinstaller --clean --onedir --name intg-${DRIVER_ID} \
                --collect-all zeroconf \
                --collect-all ucapi \
                --collect-all ucapi_framework \
                intg-${INTG_NAME}/driver.py"

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts/bin
          mv dist/intg-${DRIVER_ID}/* artifacts/bin
          mv artifacts/bin/intg-${DRIVER_ID} artifacts/bin/driver
          cp driver.json artifacts/
          echo "ARTIFACT_NAME=uc-intg-${DRIVER_ID}-${VERSION}-aarch64" >> $GITHUB_ENV

      - name: Smoke test packaged driver
        shell: bash
        run: |
          cd artifacts
          export UC_CONFIG_HOME=$(mktemp -d)
          export UC_DISABLE_MDNS_PUBLISH=true
          export UC_INTEGRATION_HTTP_PORT=9099
          timeout 20 ./bin/driver > ../driver.log 2>&1 || true
          cat ../driver.log
          grep -q "Russound integration started" ../driver.log

      - name: Create upload artifact archive
        shell: bash
        run: |
          tar czvf ${{ env.ARTIFACT_NAME }}.tar.gz -C ${GITHUB_WORKSPACE}/artifacts .
          ls -lah ${{ env.ARTIFACT_NAME }}.tar.gz

      - uses: actions/upload-artifact@v7
        id: upload_artifact
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8

      - name: Extract build archives from downloaded files
        run: |
          ls -R
          # tar.gz archives were wrapped by upload-artifact and extracted into a directory by download-artifact
          for D in *; do
            if [ -d "${D}" ]; then
              mv "${D}"/* ./
            fi
          done

      - name: Create hash file
        run: |
          for filename in *.tar.gz; do
            echo "sha256  $(sha256sum "$filename")" >> ${{ needs.build.outputs.driver_id }}.hash
          done

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.tar.gz,${{ needs.build.outputs.driver_id }}.hash"
          draft: false
          prerelease: false
          generateReleaseNotes: false
          body: ${{ needs.build.outputs.release_notes }}
          artifactErrorsFailBuild: true
          tag: v${{ needs.build.outputs.version }}
